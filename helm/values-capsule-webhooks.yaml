webhooks:
  hooks:
    generic:
      rules:
        - apiGroups: &groups [
            "acn.azure.com", "admissionregistration.k8s.io",
            "apiextensions.k8s.io", "apiregistration.k8s.io", "apps",
            "argoproj.io", "autoscaling", "azurepolicy.azure.com", "batch",
            "capsule.clastix.io", "certificates.k8s.io", "cilium.io",
            "config.gatekeeper.sh", "connection.gatekeeper.sh",
            "constraints.gatekeeper.sh", "coordination.k8s.io",
            "defender.microsoft.com", "discovery.k8s.io", "events.k8s.io",
            "expansion.gatekeeper.sh", "externaldata.gatekeeper.sh",
            "flowcontrol.apiserver.k8s.io", "gateway.networking.k8s.io",
            "hub.traefik.io", "monitoring.coreos.com",
            "multitenancy.acn.azure.com", "mutations.gatekeeper.sh",
            "networking.k8s.io", "node.k8s.io", "policy",
            "rbac.authorization.k8s.io", "resource.k8s.io", "scheduling.k8s.io",
            "secrets-store.csi.x-k8s.io", "snapshot.storage.k8s.io",
            "status.gatekeeper.sh", "storage.k8s.io", "syncset.gatekeeper.sh",
            "templates.gatekeeper.sh", "traefik.io", "velero.io"
          ]
          apiVersions: ["*"]
          operations: ["CREATE", "UPDATE"]
          resources: ["*/*"]
          scope: Namespaced
        # Core API group: AKS rejects "" with wildcard resources, so list them.
        - apiGroups: [""]
          apiVersions: ["v1"]
          operations: ["CREATE", "UPDATE"]
          resources: &core ["configmaps", "endpoints", "limitranges", "persistentvolumeclaims", "pods", "podtemplates", "replicationcontrollers", "resourcequotas", "secrets", "serviceaccounts", "services"]
          scope: Namespaced

    globalresourcequotas:
      rules:
        - apiGroups: *groups
          apiVersions: ["*"]
          operations: ["CREATE", "UPDATE"]
          resources: ["*/*"]
          scope: Namespaced
        # Core API group: AKS rejects "" with wildcard resources, so list them.
        - apiGroups: [""]
          apiVersions: ["v1"]
          operations: ["CREATE", "UPDATE"]
          resources: *core
          scope: Namespaced
        - apiGroups: ["capsule.clastix.io"]
          apiVersions: ["v1beta2"]
          operations: ["CREATE", "UPDATE"]
          resources: ["globalresourcequotas"]
          scope: Cluster

    cordoning:
      rules:
        - apiGroups: *groups
          apiVersions: ["*"]
          operations: ["CREATE", "UPDATE", "DELETE"]
          resources: ["*"]
          scope: Namespaced
        # Core API group: AKS rejects "" with wildcard resources, so list them.
        - apiGroups: [""]
          apiVersions: ["v1"]
          operations: ["CREATE", "UPDATE", "DELETE"]
          resources: *core
          scope: Namespaced

    managed:
      rules:
        - apiGroups: *groups
          apiVersions: ["*"]
          operations: ["CREATE", "UPDATE", "DELETE"]
          resources: ["*"]
          scope: Namespaced
        # Core API group: AKS rejects "" with wildcard resources, so list them.
        - apiGroups: [""]
          apiVersions: ["v1"]
          operations: ["CREATE", "UPDATE", "DELETE"]
          resources: *core
          scope: Namespaced
        - apiGroups: [""]
          apiVersions: ["v1"]
          operations: ["CREATE", "UPDATE", "DELETE"]
          resources: ["namespaces"]
          scope: Cluster
        - apiGroups: ["capsule.clastix.io"]
          apiVersions: ["v1beta2"]
          operations: ["CREATE", "UPDATE", "DELETE"]
          resources: ["globalresourcequotas"]
          scope: Cluster

    replications:
      rules:
        - apiGroups: *groups
          apiVersions: ["*"]
          operations: ["CREATE", "UPDATE", "DELETE"]
          resources: ["*"]
          scope: "*"
        # Core API group: AKS rejects "" with wildcard resources, so list them.
        - apiGroups: [""]
          apiVersions: ["v1"]
          operations: ["CREATE", "UPDATE", "DELETE"]
          resources: *core
          scope: Namespaced

    metadata:
      rules:
        - apiGroups: *groups
          apiVersions: ["*"]
          operations: ["CREATE", "UPDATE"]
          resources: ["*"]
          scope: Namespaced
        # Core API group: AKS rejects "" with wildcard resources, so list them.
        - apiGroups: [""]
          apiVersions: ["v1"]
          operations: ["CREATE", "UPDATE"]
          resources: *core
          scope: Namespaced

    # Rules are hard-coded as */* in the chart, so this can't be narrowed.
    # Only needed for legacy tenant-annotation custom resource quotas.
    customresources:
      enabled: false
