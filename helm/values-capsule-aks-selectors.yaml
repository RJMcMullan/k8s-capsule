          - { key: kubernetes.azure.com/managedby, operator: NotIn, values: ["aks"] }
    namespaces:
      namespaceSelector:
        matchExpressions:
          - { key: control-plane, operator: NotIn, values: ["true"] }
          - { key: kubernetes.azure.com/managedby, operator: NotIn, values: ["aks"] }
    cordoning:
      namespaceSelector:
        matchExpressions:
          - { key: capsule.clastix.io/tenant, operator: Exists }
          - { key: projectcapsule.dev/cordoned, operator: In, values: ["true"] }
          - { key: control-plane, operator: NotIn, values: ["true"] }
          - { key: kubernetes.azure.com/managedby, operator: NotIn, values: ["aks"] }
    gateways:
      namespaceSelector:
        matchExpressions:
